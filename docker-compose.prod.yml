services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fd-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fdpass}
      POSTGRES_DB: ${DB_NAME:-food_delivery}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-fduser} -d ${DB_NAME:-food_delivery}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fd-net

  redis:
    image: redis:7-alpine
    container_name: fd-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fd-net

  minio:
    image: minio/minio:latest
    container_name: fd-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fd-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fd-migrate
    entrypoint: ['node', 'packages/server/dist/migrate.js']
    environment:
      DATABASE_URL: postgres://${DB_USER:-fduser}:${DB_PASSWORD:-fdpass}@postgres:5432/${DB_NAME:-food_delivery}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fd-net

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fd-server
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${DB_USER:-fduser}:${DB_PASSWORD:-fdpass}@postgres:5432/${DB_NAME:-food_delivery}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-food-delivery}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/uploads}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID}
      WECHAT_PAY_API_KEY_V3: ${WECHAT_PAY_API_KEY_V3}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fd-net

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: fd-admin
    restart: unless-stopped
    networks:
      - fd-net

  nginx:
    image: nginx:alpine
    container_name: fd-nginx
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - admin
      - minio
    restart: unless-stopped
    networks:
      - fd-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  fd-net:
    driver: bridge
