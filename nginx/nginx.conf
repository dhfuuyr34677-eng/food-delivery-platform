server {
    listen 80;
    server_name lingjimgm.xyz www.lingjimgm.xyz;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API → backend server
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check → backend
    location /health {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
    }

    # Nginx self health check
    location /nginx-health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Uploads → MinIO
    location /uploads/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Lingjing → host PM2 process (port 3456)
    location /lingjing/ {
        proxy_pass http://host.docker.internal:3456/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lingjing;
        proxy_set_header Accept-Encoding "";

        # Rewrite absolute paths in responses to include /lingjing/ prefix
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/' 'src="/lingjing/';
        sub_filter 'href="/' 'href="/lingjing/';
        sub_filter 'action="/' 'action="/lingjing/';
        sub_filter "url('/" "url('/lingjing/";
        sub_filter '"/' '"/lingjing/';
        sub_filter "'/" "'/lingjing/";
        sub_filter_once off;
    }

    # Admin SPA → proxy to admin container
    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
